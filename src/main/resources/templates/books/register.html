<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register Book</title>
</head>

<body>
<h1>Register Book</h1>
<form  th:action="@{/books/register}" th:object="${book}" method="post">
<div>
    <label for="title">Título</label>
    <input id="title"
           type="text"
           th:field="*{title}"
           required>
</div>

<div>
    <label for="pages">Número de páginas</label>
    <input id="pages"
           type="number"
           th:field="*{pages}"
           min="1"
           required>
</div>

<button type="submit">Save</button>
</form>

<a th:href="@{/books/list}">Back To Library</a>
</body>
</html>
